<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07061a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hygiène">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Révision Hygiène Aurora</title>
<style>
/* Layout: appli mobile plein écran : contenu qui défile + barre d'onglets calée en bas.
   Univers noir, graphite, blanc, or ; étoile dorée à 8 branches fixe comme logo.
   Thème unique sombre, choisi volontairement. */
:root{
  --bg:#09090b; --surface:#151416; --surface-2:#1e1c1f; --surface-3:#2a2729;
  --ink:#f3efe8; --soft:#cdc6bd; --muted:#948b84; --line:#2a2628;
  --gold:#c8323c; --gold-hi:#ec7a7f; --gold-deep:#7d1820; --acc2:#ff8a3d; --on-gold:#ffffff; --acc-text:#ef8a8e;
  --good:#7fc79a; --bad:#f08a5d;
  --f-ui:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --tabbar:76px;
  --glow:color-mix(in srgb,var(--gold) 16%,var(--surface));
  --grad:linear-gradient(120deg,var(--gold-hi) 0%,var(--gold) 45%,var(--acc2) 100%);
  --surface-a:color-mix(in srgb,var(--surface) 84%,transparent);
  --aura:.6;
  color-scheme:dark;
}
:root[data-pal="or"]{--bg:#08080a;--surface:#141416;--surface-2:#1c1c1f;--surface-3:#25252a;--ink:#f4f3ef;--soft:#c9c8c3;--muted:#8e8d89;--line:#26262a;
  --gold:#e6b325;--gold-hi:#f3d36a;--gold-deep:#a8740f;--acc2:#ff8f3c;--on-gold:#0b0b0c;--acc-text:#f3d36a;--good:#7fc79a;--bad:#e4766d}
:root[data-pal="emeraude"]{--bg:#070b0a;--surface:#111716;--surface-2:#18201e;--surface-3:#222c29;--ink:#eef4f1;--soft:#c2d0ca;--muted:#86958f;--line:#1f2926;
  --gold:#2fbf8f;--gold-hi:#86e3c2;--gold-deep:#13704f;--acc2:#2bb3e6;--on-gold:#04110c;--acc-text:#86e3c2;--good:#9ed36a;--bad:#ee7b6e}
:root[data-pal="nebuleuse"]{--bg:#07061a;--surface:#110f2b;--surface-2:#1a1742;--surface-3:#27225c;--ink:#f1efff;--soft:#cbc6f2;--muted:#8f89c2;--line:#26215e;
  --gold:#7b5cff;--gold-hi:#b9a8ff;--gold-deep:#3b2bb0;--acc2:#38b6ff;--on-gold:#ffffff;--acc-text:#b9a8ff;--good:#5fe3b0;--bad:#ff7a9c}
:root[data-pal="ivoire"]{--bg:#f2ede3;--surface:#fffcf6;--surface-2:#efe8db;--surface-3:#e0d7c6;--ink:#1b1814;--soft:#4b443b;--muted:#7a7266;--line:#e3dacb;
  --gold:#b07d12;--gold-hi:#d6a43a;--gold-deep:#7a560a;--acc2:#c45f34;--on-gold:#ffffff;--acc-text:#8a5f08;--good:#2f8a55;--bad:#c2463a;--aura:.35;color-scheme:light}
:root{padding:0!important;margin:0}
html{height:100%;box-sizing:border-box;overflow:hidden}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;margin:0;
  height:100%;height:100dvh;height:var(--app-h,100dvh);overflow:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.scroller::-webkit-scrollbar{display:none;width:0;height:0}
.scroller{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:520px;margin:0 auto;padding-block:18px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance;font-weight:800;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:12px}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.explain{font-size:14px;color:var(--muted)}
.star{display:block}

/* haut */
.topbar{display:flex;align-items:center;gap:12px}
.topbar .who{flex:1;min-width:0}
.topbar .who p{color:var(--muted);font-size:13px}
.topbar .who h2{font-size:19px}
.logo{width:44px;height:44px;border-radius:50%;background:var(--surface-a);border:1px solid var(--line);display:grid;place-items:center;flex:none;position:relative}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--surface-a);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.lvl{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;border-radius:999px;background:var(--surface-a);border:1px solid var(--line);font-size:12px;font-weight:700;flex:none}
.lvl b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--grad);background-size:200% 200%;color:var(--on-gold);font-size:11px}

.panel{background:var(--surface-a);border:1px solid var(--line);border-radius:22px;padding:18px}
.glow-panel{background:radial-gradient(120% 140% at 0% 0%,var(--glow) 0%,var(--surface) 58%)}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sechead h3{font-size:18px}
.sechead button{color:var(--gold);font-size:14px;font-weight:600}

/* héros */
.hero-card{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{position:relative;width:128px;height:128px}
.ring svg{display:block}
.ring .val{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .val b{font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;background:var(--grad);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradshift 5s linear infinite}
.ring .val small{font-size:12px;color:var(--muted)}
.hero-card .txt{display:flex;flex-direction:column;gap:8px;min-width:0}
.hero-card h3{font-size:20px}
.xpbar{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold-deep),var(--gold),var(--acc2));transform-origin:left;animation:xpfill 1.1s cubic-bezier(.3,.7,.2,1) both .2s}
@keyframes xpfill{from{transform:scaleX(0)}}
.xpmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* tuiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface-a);border:1px solid var(--line);border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.tile > span{font-size:12px;color:var(--muted)}
.tile.hl{background:linear-gradient(135deg,var(--gold-hi),var(--gold) 45%,var(--acc2));background-size:220% 220%;border-color:transparent;color:var(--on-gold);animation:sheen 7s ease-in-out infinite}
.tile.hl > span{color:color-mix(in srgb,var(--on-gold) 75%,transparent)}
@keyframes sheen{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}

/* lignes */
.rowcard{display:flex;align-items:center;gap:14px}
.rowcard .txt{flex:1;min-width:0}
.rowcard h3{font-size:18px}
.rowcard p{color:var(--muted);font-size:13px}
.ic{width:46px;height:46px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--muted)}
.ic.g{background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--gold)}
.ic.r{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.go{width:54px;height:54px;border-radius:50%;background:var(--grad);background-size:200% 200%;color:var(--on-gold);display:grid;place-items:center;flex:none;animation:breathe 2.6s ease-in-out infinite,gradshift 6s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 6px color-mix(in srgb,var(--gold) 14%,transparent)}50%{box-shadow:0 0 0 13px color-mix(in srgb,var(--gold) 4%,transparent)}}
.count{min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:var(--bad);color:var(--on-gold);font-weight:800;font-size:13px;display:grid;place-items:center;flex:none}

/* barres scores */
.bars{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:120px;padding-top:18px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;min-width:0}
.bars .b i{width:6px;border-radius:3px;background:var(--surface-3);display:block;position:relative;transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both .3s}
.bars .b.on i{background:linear-gradient(0deg,var(--gold),var(--acc2))}
.bars .b.last i::before{content:"";position:absolute;top:-12px;left:50%;width:8px;height:8px;margin-left:-6px;border-radius:50%;border:2px solid var(--ink);background:var(--bg)}
.bars .b span{font-family:var(--f-mono);font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
@keyframes grow{from{transform:scaleY(0)}}
.empty{color:var(--muted);font-size:14px;padding-block:10px}

/* pastilles */
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.pills::-webkit-scrollbar{display:none}
.pills.wrap{flex-wrap:wrap}
.pill{padding:9px 16px;border-radius:999px;background:var(--surface-a);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--grad);background-size:200% 200%;border-color:transparent;color:var(--on-gold)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-a);border:1px solid var(--line);border-radius:999px;padding:4px;position:relative}
.seg button{position:relative;z-index:1;padding:10px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--on-gold)}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--grad);background-size:200% 200%;transition:transform .3s cubic-bezier(.3,.7,.2,1)}
.seg.right .thumb{transform:translateX(100%)}

/* cours */
.list{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.course{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface-a);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.course .meta{flex:1;min-width:0}
.course .name{font-weight:700;font-size:16px;line-height:1.25;display:block}
.course .sub{font-size:13px;color:var(--muted)}
.mini{height:4px;border-radius:2px;background:var(--surface-3);margin-top:8px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--grad)}
.state{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);flex:none}
.done .state{background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--gold)}

/* fiches */
.deck{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.deck::-webkit-scrollbar{display:none}
.card{flex:0 0 100%;scroll-snap-align:center;background:var(--surface-a);border:1px solid var(--line);border-radius:24px;
  padding:22px 20px;min-height:min(56vh,480px);display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.card .corner{position:absolute;right:-34px;top:-34px;opacity:.06}
.card h3{font-size:25px;position:relative}
.card ul,.card ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px}
.card li::marker{color:var(--gold)}
.card .key{margin-top:auto;background:var(--surface-2);border-radius:16px;padding:14px;font-size:15px}
.card .key b{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:6px;color:var(--gold);margin-bottom:4px}
.card table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.card td{border-top:1px solid var(--line);padding:8px 4px;vertical-align:top}
.card td:first-child{font-weight:700;padding-right:10px}
.card td:last-child{color:var(--soft)}
.card.end{justify-content:center;align-items:flex-start;background:radial-gradient(120% 100% at 100% 0%,var(--glow) 0%,var(--surface) 60%)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex:1}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--surface-3);transition:all .25s}
.dots i.on{background:var(--grad);width:22px}
.nav{width:48px;height:48px;border-radius:50%;background:var(--surface-a);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.nav.primary{background:var(--grad);background-size:200% 200%;border-color:transparent;color:var(--on-gold)}
.nav:disabled{opacity:.3;cursor:default}

/* flashcards */
.stack{position:relative;height:min(52vh,430px);perspective:1200px}
.fc{position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .35s cubic-bezier(.3,.7,.2,1),opacity .35s}
.fc.dragging{transition:none}
.fc .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.fc.flipped .inner{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:24px 22px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);background:var(--surface-a);overflow:hidden}
.fc .back{transform:rotateY(180deg);background:radial-gradient(120% 100% at 100% 0%,var(--glow) 0%,var(--surface) 60%);border-color:var(--gold-deep)}
.fc .face h3{font-size:23px}
.fc .face .hint{margin-top:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.fc .ans{font-size:19px;font-weight:700;color:var(--acc-text)}
.fc .stamp{position:absolute;top:22px;padding:6px 12px;border-radius:10px;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;opacity:0;border:2px solid}
.fc .stamp.ok{right:20px;color:var(--good);border-color:var(--good);transform:rotate(8deg)}
.fc .stamp.ko{left:20px;color:var(--bad);border-color:var(--bad);transform:rotate(-8deg)}
.fc.behind{transform:scale(.94) translateY(16px);opacity:.6;pointer-events:none}
.fc.behind2{transform:scale(.88) translateY(32px);opacity:.3;pointer-events:none}
.fcbar{display:flex;justify-content:center;align-items:center;gap:22px}
.fcbtn{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--surface)}
.fcbtn.ko{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.fcbtn.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent)}
.fcbtn.flip{width:50px;height:50px;color:var(--gold)}

/* boutons */
.btn{border-radius:999px;padding:14px 20px;font-weight:700;background:var(--grad);background-size:200% 200%;animation:gradshift 7s ease-in-out infinite;color:var(--on-gold);text-align:center}
.btn.dark{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.good{background:var(--good)} .btn.bad{background:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1;min-width:130px}

/* modes d'examen */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface-a);border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0}
.mode h3{font-size:16px}
.mode p{font-size:12px;color:var(--muted)}
.mode.main{grid-column:1/-1;background:radial-gradient(140% 120% at 100% 0%,var(--glow) 0%,var(--surface) 60%);flex-direction:row;align-items:center;gap:16px}
.mode.main .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mode.main h3{font-size:22px}
.mode.main .go{width:64px;height:64px}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px}
.qtop .t{flex:1;min-width:0}
.qtop h2{font-size:18px}
.track{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.track i{display:block;height:100%;background:var(--grad);transition:width .35s}
.qbox{display:flex;flex-direction:column;gap:16px}
.qbox h3{font-size:22px}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{background:var(--surface-2);border-radius:999px;padding:4px 10px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tag.g{color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.combo{margin-left:auto;font-weight:800;color:var(--gold);font-size:15px}
.combo.bump{animation:pop .35s both}
.timer{position:relative;width:44px;height:44px;flex:none}
.timer svg{display:block;transform:rotate(-90deg)}
.timer span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.timer.low span{color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--surface-2);border:1.5px solid transparent;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;width:100%}
.opt .l{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none}
.opt.right{border-color:var(--good);animation:pulse .7s ease-out} .opt.right .l{background:var(--good);color:var(--on-gold)}
.opt.wrong{border-color:var(--bad);animation:shake .4s} .opt.wrong .l{background:var(--bad);color:var(--on-gold)}
.opt:disabled{cursor:default}
.answer{background:var(--surface-2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.verdict{font-weight:800;animation:pop .35s both}
.verdict.ok{color:var(--good)} .verdict.ko{color:var(--bad)}
.xpfloat{position:fixed;left:50%;top:42%;transform:translateX(-50%);font-weight:800;font-size:22px;color:var(--gold);pointer-events:none;z-index:60;animation:floatup .9s ease-out forwards}
@keyframes floatup{from{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1}to{opacity:0;transform:translate(-50%,-60px) scale(1.1)}}
.review{display:flex;flex-direction:column;gap:10px;list-style:none;padding:0;margin:0}
.review li{background:var(--surface-a);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px;color:var(--soft)}
.review li b{display:block;margin-bottom:4px;font-size:15px;color:var(--ink)}
.gain{display:flex;gap:10px}
.gain .tile{flex:1}

/* badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--surface-a);border:1px solid var(--line);border-radius:18px;padding:14px 8px;min-width:0}
.badge .medal{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);opacity:.55}
.badge.on .medal{opacity:1;background:radial-gradient(circle at 35% 30%,var(--gold-hi),var(--gold) 55%,var(--gold-deep));color:var(--on-gold);box-shadow:0 0 16px color-mix(in srgb,var(--gold) 25%,transparent)}
.badge b{font-size:12px;line-height:1.25}
.badge span{font-size:11px;color:var(--muted);line-height:1.3}
.badge:not(.on) b{color:var(--muted)}

/* toast + confirmation */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:70;transform:translate(-50%,-140%);display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--gold-deep);border-radius:16px;padding:10px 14px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:transform .45s cubic-bezier(.3,.7,.2,1),opacity .3s,visibility 0s linear .45s}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .45s cubic-bezier(.3,.7,.2,1),opacity .2s,visibility 0s}
.toast b{display:block;font-size:14px}
.toast span{font-size:12px;color:var(--muted)}
.confirm{display:flex;flex-direction:column;gap:12px}

/* barre d'onglets */
.tabbar{flex:none;position:relative;z-index:20;background:var(--surface-a);border-top:1px solid var(--line);border-radius:26px 26px 0 0;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar nav{max-width:560px;margin:0 auto;height:var(--tabbar);display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:center;padding:0 12px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding-block:6px;position:relative}
.tab[aria-current="page"]{color:var(--gold)}
.tab[aria-current="page"] svg{animation:pop .35s both}
.tab .dot{position:absolute;top:2px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--bad)}
.tab.center{width:60px;height:60px;border-radius:50%;background:var(--grad);background-size:200% 200%;animation:gradshift 6s ease-in-out infinite;color:var(--on-gold);display:grid;place-items:center;margin-top:-34px;box-shadow:0 0 0 6px var(--bg)}


/* v3 */
body{transition:background-color .35s ease,color .35s ease}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sw{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;border-radius:16px;background:var(--surface-2);border:1.5px solid transparent;font-size:11px;font-weight:700;color:var(--soft);line-height:1.2;text-align:center}
.sw[aria-pressed="true"]{border-color:var(--gold);color:var(--ink)}
.sw i{width:36px;height:36px;border-radius:50%;display:block;box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 18%,transparent)}
.field{width:100%;padding:13px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:16px;min-height:48px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface-a);border:1px solid var(--line);border-radius:16px;padding:0 14px;color:var(--muted)}
.search:focus-within{border-color:var(--gold)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:14px 0;outline:none}
.search input::placeholder{color:var(--muted)}
.results{display:flex;flex-direction:column;gap:8px}
.hit{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--surface-a);border:1px solid var(--line);border-radius:16px;padding:12px 14px;width:100%}
.hit b{font-size:15px}
.hit .explain{font-size:13px;overflow-wrap:anywhere}
.mast{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.mast li{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:14px}
.mast li b{font-variant-numeric:tabular-nums;font-size:13px}
.mbar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:3px;background:var(--grad);transform-origin:left;animation:xpfill 1s cubic-bezier(.3,.7,.2,1) both .3s}
.mbar i.lowm{background:var(--bad)}
.mbar i.him{background:var(--good)}
.mast.in-l>li{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--j,0)*35ms + 120ms)}
.countdown .jj{width:64px;height:64px;border-radius:18px;flex:none;display:grid;place-items:center;background:var(--grad);background-size:200% 200%;animation:gradshift 6s ease-in-out infinite;color:var(--on-gold)}
.countdown .jj b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.addd{width:100%;text-align:left;color:var(--ink)}
.addd>svg{color:var(--muted);flex:none}
.opt.picked{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--surface-2))}
.review .yours{display:block;color:var(--bad);margin-bottom:2px}
.review .good-a{color:var(--good);font-weight:700}
.tag.clock{font-size:13px;padding:6px 12px;font-variant-numeric:tabular-nums}
.tag.clock.low{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.mode.real{background:radial-gradient(140% 120% at 0% 0%,var(--glow) 0%,var(--surface) 70%)}

/* v4 : aurore, dégradés, mouvement */
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes gradshift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes spinb{to{--ang:360deg}}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:var(--aura)}
.aurora b{position:absolute;width:85vmax;height:85vmax;border-radius:50%;filter:blur(10px);will-change:transform}
.aurora b:nth-child(1){left:-35vmax;top:-30vmax;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 55%,transparent) 0,transparent 62%);animation:drift1 22s ease-in-out infinite alternate}
.aurora b:nth-child(2){right:-40vmax;top:10vmax;background:radial-gradient(circle,color-mix(in srgb,var(--acc2) 45%,transparent) 0,transparent 62%);animation:drift2 26s ease-in-out infinite alternate}
.aurora b:nth-child(3){left:-10vmax;bottom:-50vmax;background:radial-gradient(circle,color-mix(in srgb,var(--gold-hi) 30%,transparent) 0,transparent 60%);animation:drift3 30s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(28vmax,18vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-26vmax,24vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(18vmax,-22vmax) scale(1.2)}}
.aurora s{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--ink);opacity:0;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:.7;transform:scale(1)}}
.scroller,.tabbar{position:relative;z-index:1}
.tabbar{background:color-mix(in srgb,var(--surface) 78%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.tabbar nav{position:relative}
.tabind{position:absolute;top:-1px;height:3px;width:30px;border-radius:0 0 3px 3px;background:var(--grad);left:0;opacity:0;transition:transform .45s cubic-bezier(.3,.7,.2,1),opacity .3s;box-shadow:0 0 12px color-mix(in srgb,var(--gold) 70%,transparent)}
.glow-panel{position:relative;isolation:isolate}
.glow-panel::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from var(--ang),transparent 0 55%,var(--gold-hi) 70%,var(--acc2) 82%,transparent 95%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spinb 6s linear infinite}
.btn,.opt,.course,.mode,.pill,.hit,.sw,.go,.nav,.fcbtn{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.28;pointer-events:none;animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}
.qbox.leave{animation:leave .2s ease-in forwards!important}
@keyframes leave{to{opacity:0;transform:translateX(-36px) scale(.98)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.stack{animation:floaty 4.5s ease-in-out infinite}
.gtext{background:var(--grad);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradshift 5s linear infinite}
.topbar .who h2{background:linear-gradient(90deg,var(--ink) 0 55%,var(--gold-hi) 75%,var(--ink) 95%);background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep 6s ease-in-out infinite}
@keyframes sweep{0%{background-position:100% 0}60%,100%{background-position:-60% 0}}
.card{background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 9%,var(--surface-a)) 0%,var(--surface-a) 45%)}
.card::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--grad)}
.opt.right{background:color-mix(in srgb,var(--good) 14%,var(--surface-2))}
.verdict.ok{background:linear-gradient(90deg,var(--good),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
/* mouvement */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.app.in>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
.list.in-l>li,.badges.in-l>div{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--j,0)*40ms + 140ms)}
.swap{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringfill{from{stroke-dashoffset:var(--c)}}
.ring .arc{animation:ringfill 1.2s cubic-bezier(.3,.7,.2,1) both .15s}
@keyframes twinkle{0%,100%{filter:drop-shadow(0 0 0 color-mix(in srgb,var(--gold-hi) 0%,transparent));transform:scale(1)}50%{filter:drop-shadow(0 0 5px color-mix(in srgb,var(--gold-hi) 70%,transparent));transform:scale(1.06)}}
.logo .star{animation:twinkle 3.6s ease-in-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}100%{box-shadow:0 0 0 14px color-mix(in srgb,var(--good) 0%,transparent)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.btn,.opt,.course,.pill,.nav,.go,.tab,.mode,.fcbtn,.iconbtn{transition:transform .12s ease,background-color .2s,border-color .2s}
.btn:active,.opt:active,.course:active,.pill:active,.nav:active,.go:active,.tab:active,.mode:active,.fcbtn:active,.iconbtn:active{transform:scale(.95)}
.burst{position:fixed;left:50%;top:38%;width:0;height:0;pointer-events:none;z-index:50}
.burst i{position:absolute;left:0;top:0;animation:fly 1.2s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes fly{from{transform:translate(-50%,-50%) scale(.2) rotate(0);opacity:1}to{transform:translate(calc(var(--x) - 50%),calc(var(--y) - 50%)) scale(1) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<body>
<div class="aurora" id="aurora" aria-hidden="true"><b></b><b></b><b></b></div>
<div class="scroller" id="scroller"><div class="app" id="app"></div></div>
<div class="tabbar"><nav id="tabs" aria-label="Navigation"></nav></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const COURSES = [
{ id:"reglementation", title:"Cadre réglementaire", sub:"ARS, formation, textes",
 cards:[
  {h:"Trois obligations", html:`<ul><li><b>Déclarer</b> son activité à l'ARS du lieu d'exercice.</li><li><b>Suivre</b> la formation hygiène et salubrité dans un organisme habilité.</li><li><b>Respecter</b> les bonnes pratiques d'hygiène.</li></ul>`, key:"Ce sont trois obligations distinctes : l'une ne remplace pas l'autre."},
  {h:"La formation", html:`<p>21 heures, réparties sur 3 jours minimum, dans un organisme habilité.</p><p>L'attestation se conserve et se présente lors d'un contrôle.</p>`, key:"Arrêté du 12 décembre 2008 : contenu et durée de la formation."},
  {h:"La déclaration ARS", html:`<ul><li>Faite avant de commencer l'activité.</li><li>Pour chaque lieu d'exercice.</li><li>Y compris pour une convention ou un guest.</li></ul>`, key:"Pas de déclaration ou pas de formation = contravention possible."},
  {h:"Les textes à connaître", html:`<table><tr><td>CSP R.1311-1 à 13</td><td>Règles d'hygiène, déclaration, déchets, info client</td></tr><tr><td>Décret 2008-149</td><td>Conditions d'exercice</td></tr><tr><td>Arrêté 11 mars 2009</td><td>Bonnes pratiques d'hygiène</td></tr><tr><td>Arrêté 3 déc. 2008</td><td>Information du client</td></tr><tr><td>REACH UE 2020/2081</td><td>Substances interdites dans les encres</td></tr></table>`}
 ]},
{ id:"microbio", title:"Risques infectieux", sub:"Germes, transmission, vocabulaire",
 cards:[
  {h:"Le risque principal", html:`<p>Le tatouage effracte la peau. Deux risques dominent :</p><ul><li>la transmission de <b>virus par le sang</b> (VHB, VHC, VIH) ;</li><li>l'<b>infection bactérienne</b> de la plaie (staphylocoque doré, streptocoque, Pseudomonas).</li></ul>`},
  {h:"Le VHB, champion de résistance", html:`<p>Le virus de l'hépatite B survit jusqu'à 7 jours hors du corps sur une surface.</p><p>Il est bien plus contagieux que le VIH. Un vaccin existe.</p>`, key:"Vaccination hépatite B recommandée pour le tatoueur."},
  {h:"Échelle de résistance", html:`<p>Du plus fragile au plus résistant aux désinfectants :</p><ol><li>Virus enveloppés (VIH, VHB)</li><li>Bactéries</li><li>Champignons</li><li>Virus nus</li><li>Mycobactéries</li><li>Spores</li><li>Prions</li></ol>`},
  {h:"La chaîne de transmission", html:`<p><b>Réservoir</b> → <b>mode de transmission</b> → <b>porte d'entrée</b> → <b>hôte réceptif</b>.</p><p>En tatouage, la porte d'entrée est la plaie elle-même.</p>`, key:"Casser un seul maillon suffit à empêcher l'infection."},
  {h:"Vocabulaire", html:`<table><tr><td>Asepsie</td><td>Empêcher l'apport de germes</td></tr><tr><td>Antisepsie</td><td>Éliminer les germes sur un tissu vivant (peau)</td></tr><tr><td>Désinfection</td><td>Éliminer les germes sur un objet ou une surface</td></tr><tr><td>Stérilisation</td><td>Détruire tous les micro-organismes, spores comprises</td></tr><tr><td>Bionettoyage</td><td>Nettoyage + désinfection des surfaces</td></tr></table>`}
 ]},
{ id:"mains", title:"Mains et tenue", sub:"Lavage, SHA, gants",
 cards:[
  {h:"Lavage simple", html:`<ul><li>Mains visiblement sales, arrivée au salon, sortie des toilettes.</li><li>Savon doux + eau, 30 secondes minimum.</li><li>Essuie-mains à usage unique.</li></ul>`},
  {h:"Friction hydroalcoolique", html:`<ul><li>Avant de mettre des gants, après les avoir retirés, entre deux étapes.</li><li>30 secondes, jusqu'à séchage complet.</li><li>Produit conforme à la norme EN 1500.</li></ul>`, key:"Les gants ne remplacent jamais l'hygiène des mains."},
  {h:"Prérequis", html:`<ul><li>Ongles courts, sans vernis ni faux ongles.</li><li>Aucun bijou : bague, montre, bracelet.</li><li>Avant-bras dégagés.</li><li>Plaie aux mains couverte par un pansement étanche.</li></ul>`},
  {h:"Les gants", html:`<ul><li>Nitrile, usage unique, non stériles.</li><li>Changés à chaque client.</li><li>Changés dès qu'ils touchent une surface non protégée : téléphone, tiroir, flacon.</li></ul>`},
  {h:"Tenue", html:`<p>Tenue propre réservée au travail, cheveux attachés, tablier jetable recommandé pendant l'acte.</p>`, key:"Vaccins recommandés : hépatite B (avec sérologie) et DTP à jour."}
 ]},
{ id:"locaux", title:"Locaux et désinfection", sub:"Marche en avant, normes, fréquences",
 cards:[
  {h:"Organisation du salon", html:`<ul><li>Salle de tatouage dédiée, séparée de l'accueil.</li><li>Lavabo, savon, essuie-mains à usage unique.</li><li>Zone de nettoyage séparée si matériel réutilisable.</li><li>Surfaces lisses, lessivables, non poreuses.</li><li>Pas d'animaux ni de nourriture en salle.</li></ul>`},
  {h:"La marche en avant", html:`<p>Le circuit va toujours du <b>propre vers le sale</b>, sans retour en arrière.</p><p>Le matériel sale ne croise jamais le matériel stérile.</p>`},
  {h:"Normes des désinfectants", html:`<table><tr><td>EN 13727 / 14561</td><td>Bactéricide</td></tr><tr><td>EN 13624 / 14562</td><td>Levuricide</td></tr><tr><td>EN 14476</td><td>Virucide</td></tr><tr><td>EN 14348</td><td>Mycobactéricide</td></tr></table>`, key:"Vérifier la norme sur l'étiquette avant d'acheter."},
  {h:"Fréquences", html:`<table><tr><td>Entre chaque client</td><td>Fauteuil, accoudoir, plan de travail, lampe, machine + nouvelles protections plastiques</td></tr><tr><td>Chaque jour</td><td>Sols, surfaces, lavabo, poubelles</td></tr><tr><td>Chaque semaine</td><td>Murs à hauteur de contact, rangements, aérations</td></tr></table>`},
  {h:"La méthode", html:`<ul><li>Du haut vers le bas.</li><li>Du plus propre au plus sale.</li><li>Jamais deux produits mélangés.</li><li>Dilution et temps de contact respectés.</li></ul>`}
 ]},
{ id:"sterilisation", title:"Matériel et stérilisation", sub:"Usage unique, autoclave",
 cards:[
  {h:"Usage unique obligatoire", html:`<p>Aiguilles et cartouches, godets d'encre, gants, rasoirs, protections plastiques.</p><ul><li>Emballage intact.</li><li>Date de péremption vérifiée.</li><li>Ouvert devant le client.</li></ul>`},
  {h:"Le circuit du réutilisable", html:`<ol><li>Pré-désinfection (immersion immédiate)</li><li>Nettoyage, ultrasons possibles, rinçage</li><li>Séchage</li><li>Conditionnement en sachet</li><li>Stérilisation à l'autoclave</li><li>Contrôle et traçabilité</li><li>Stockage au sec</li></ol>`, key:"L'ordre compte : on ne stérilise jamais un objet sale."},
  {h:"L'autoclave", html:`<ul><li>Classe B, à vide fractionné : le seul adapté aux objets creux et emballés.</li><li>Cycle de référence : <b>134 °C pendant 18 minutes</b> (cycle prion).</li></ul>`},
  {h:"Contrôles", html:`<ul><li>Test de Bowie-Dick : pénétration de la vapeur.</li><li>Test de vide.</li><li>Indicateur de passage qui vire sur chaque sachet.</li><li>Registre des cycles, maintenance annuelle.</li></ul>`},
  {h:"Interdits", html:`<p>Ne valent pas stérilisation :</p><ul><li>stérilisateur à billes ;</li><li>Poupinel (chaleur sèche) ;</li><li>lampe UV ;</li><li>trempage seul.</li></ul>`}
 ]},
{ id:"seance", title:"Déroulé d'une séance", sub:"Poste, peau, acte, fin",
 cards:[
  {h:"Avant l'acte", html:`<ol><li>Information écrite remise, questionnaire, consentement signé.</li><li>Surfaces désinfectées, protections posées.</li><li>Matériel stérile disposé, emballages fermés.</li><li>Hygiène des mains, gants.</li></ol>`},
  {h:"Préparation cutanée en 4 temps", html:`<ol><li><b>Détersion</b> : savon antiseptique</li><li><b>Rinçage</b> : eau stérile ou sérum physiologique</li><li><b>Séchage</b> : compresse stérile</li><li><b>Antisepsie</b> : antiseptique de la même gamme, temps de séchage respecté</li></ol>`, key:"Ne jamais mélanger deux familles : chlorhexidine OU povidone iodée."},
  {h:"Pendant l'acte", html:`<ul><li>Rasoir à usage unique, avant l'antisepsie.</li><li>Stencil et vaseline prélevés dans un godet ou à la spatule, jamais dans le pot.</li><li>Encre servie en godets à usage unique.</li><li>Gants changés dès qu'ils touchent une surface non protégée.</li></ul>`},
  {h:"Après l'acte", html:`<ol><li>Nettoyage de la zone, pansement ou film.</li><li>Conseils de soins remis.</li><li>Aiguilles directement au collecteur, sans recapuchonner.</li><li>Désinfection du poste avant le client suivant.</li></ol>`}
 ]},
{ id:"encres", title:"Encres et produits", sub:"REACH, étiquetage, traçabilité",
 cards:[
  {h:"Encres conformes REACH", html:`<p>Depuis le 4 janvier 2022, la restriction européenne UE 2020/2081 interdit ou limite de nombreuses substances dans les encres.</p>`, key:"Seules des encres conformes peuvent être utilisées."},
  {h:"L'étiquette doit indiquer", html:`<ul><li>« Mélange destiné aux tatouages ou au maquillage permanent »</li><li>Numéro de lot</li><li>Date de péremption</li><li>Liste des ingrédients</li><li>Conditions d'utilisation</li></ul>`},
  {h:"Bonnes pratiques", html:`<ul><li>Flacon stérile, délai après ouverture respecté.</li><li>Dilution à l'eau stérile ou au diluant du fabricant, jamais à l'eau du robinet.</li><li>Godets jetés après chaque client.</li><li>Stockage à l'abri de la lumière et de la chaleur.</li></ul>`},
  {h:"Traçabilité", html:`<p>Noter couleurs et numéros de lot dans la fiche client.</p><p>Un effet indésirable se signale sur signalement-sante.gouv.fr.</p>`, key:"Indispensable en cas de réaction ou de rappel produit."}
 ]},
{ id:"dasri", title:"Déchets et DASRI", sub:"Filières, délais, documents",
 cards:[
  {h:"Qu'est-ce qu'un DASRI ?", html:`<p>Déchet d'activité de soins à risque infectieux : tout déchet souillé de sang ou piquant/coupant.</p>`, key:"Le tatoueur en est responsable jusqu'à l'élimination finale."},
  {h:"Les filières", html:`<table><tr><td>Piquants / coupants</td><td>Collecteur rigide jaune NF X 30-500, fermé aux 3/4</td></tr><tr><td>DASRI mous</td><td>Sac ou carton jaune, pictogramme danger biologique</td></tr><tr><td>Non souillés</td><td>Sac noir classique</td></tr></table>`},
  {h:"Délais de stockage", html:`<table><tr><td>≤ 5 kg / mois</td><td>3 mois</td></tr><tr><td>5 à 15 kg / mois</td><td>1 mois</td></tr><tr><td>> 15 kg / mois</td><td>7 jours</td></tr><tr><td>> 100 kg / semaine</td><td>72 heures</td></tr></table>`, key:"Un salon produit en général moins de 5 kg par mois : 3 mois."},
  {h:"Documents", html:`<ul><li>Convention écrite avec un prestataire agréé.</li><li>Bons de prise en charge ou bordereaux Cerfa, conservés <b>3 ans</b>.</li></ul>`},

/* ---------- état ---------- */
const KEY="hyg-progress";
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}") }catch(e){ return {} } },
  set(v){ try{ localStorage.setItem(KEY,JSON.stringify(v)) }catch(e){} }
};
let P = store.get();
function norm(){ P.done=P.done||{}; P.scores=P.scores||[]; P.days=P.days||[]; P.xp=P.xp||0; P.wrong=P.wrong||{}; P.cards=P.cards||0; P.badges=P.badges||{}; P.perfect=P.perfect||false; P.box=P.box||{}; P.st=P.st||{}; }
norm();
const save = () => store.set(P);

const app=document.getElementById("app"), tabs=document.getElementById("tabs"), scroller=document.getElementById("scroller"), toastEl=document.getElementById("toast");
const toTop=()=>{ scroller.scrollTop=0 };
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const reduce=(()=>{try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}})();
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const courseOf=q=>COURSES.find(c=>c.id===q.c);
const doneCount=()=>COURSES.filter(c=>P.done[c.id]).length;
const best=()=>P.scores.length?Math.max(...P.scores.map(s=>s.p)):null;
const wrongList=()=>QUESTIONS.filter(q=>P.wrong[q.q]);
const dkey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function markDay(){const k=dkey(new Date());if(!P.days.includes(k)){P.days.push(k);P.days=P.days.slice(-120);save()}}
function streak(){let s=0;const d=new Date();if(!P.days.includes(dkey(d)))d.setDate(d.getDate()-1);while(P.days.includes(dkey(d))){s++;d.setDate(d.getDate()-1)}return s}

/* ---------- niveaux et objectif du jour ---------- */
const GOAL=40;
const LEVELS=[[0,"Apprenti"],[100,"Initié"],[250,"Confirmé"],[500,"Aguerri"],[850,"Expert"],[1300,"Maître"],[2000,"Légende"]];
function level(xp=P.xp){let i=0;while(i<LEVELS.length-1&&xp>=LEVELS[i+1][0])i++;const cur=LEVELS[i][0],next=LEVELS[i+1]?LEVELS[i+1][0]:null;return {n:i+1,name:LEVELS[i][1],cur,next,pct:next?Math.round((xp-cur)/(next-cur)*100):100}}
const dayXP=()=>P.day&&P.day.d===dkey(new Date())?P.day.xp:0;
function addXP(n){
  if(!n)return;
  const before=level().n,k=dkey(new Date());
  if(!P.day||P.day.d!==k)P.day={d:k,xp:0};
  const was=P.day.xp;P.day.xp+=n;P.xp+=n;
  if(was<GOAL&&P.day.xp>=GOAL){P.goalHit=true;setTimeout(()=>{toast(svg(I.target,22),"Objectif du jour atteint",GOAL+" XP aujourd'hui");burst()},300)}
  save();
  const after=level();if(after.n>before)setTimeout(()=>{toast(star(28),`Niveau ${after.n} : ${after.name}`,"Tu passes au niveau supérieur");burst()},2900);
}
function xpFloat(n){if(reduce||!n)return;const el=document.createElement("div");el.className="xpfloat";el.textContent="+"+n+" XP";document.body.appendChild(el);setTimeout(()=>el.remove(),950)}

/* ---------- répétition espacée et maîtrise ---------- */
const INT=[0,1,2,4,8,16];
function record(q,ok){
  const e=P.box[q.q]||{b:0};e.b=ok?Math.min(5,e.b+1):1;
  const d=new Date();d.setDate(d.getDate()+(ok?INT[e.b]:0));e.due=dkey(d);P.box[q.q]=e;
  const s=P.st[q.c]||{ok:0,n:0};s.n++;if(ok)s.ok++;P.st[q.c]=s;
  if(ok)delete P.wrong[q.q];else P.wrong[q.q]=1;
}
function dueList(){
  const t=dkey(new Date());
  const due=QUESTIONS.filter(q=>P.box[q.q]&&P.box[q.q].due<=t);
  const fresh=QUESTIONS.filter(q=>!P.box[q.q]).slice(0,Math.max(0,10-due.length));
  return [...due,...fresh].slice(0,20);
}
const mastery=c=>{const s=P.st[c.id];return s&&s.n?Math.round(s.ok/s.n*100):null};
function weakest(){
  let w=null;COURSES.forEach((c,i)=>{const s=P.st[c.id];if(!s||s.n<3)return;const m=s.ok/s.n;if(m<0.8&&(!w||m<w.m))w={c,i,m:Math.round(m*100)}});return w;
}
function daysLeft(){
  if(!P.exam)return null;const [y,m,d]=P.exam.split("-").map(Number);const t=new Date();t.setHours(0,0,0,0);
  return Math.round((new Date(y,m-1,d)-t)/864e5);
}
const longDate=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})};

let toastTimer;

function animateIn(){
  [...app.children].forEach((el,i)=>el.style.setProperty("--i",Math.min(i,10)));

function ringSVG(pct,size=128){

  <circle class="arc" style="--c:${c.toFixed(1)}" cx="${m}" cy="${m}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${m} ${m})"/></svg>`;

/* ---------- cours et recherche ---------- */
const plain=s=>s.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
const fold=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function courses(filter="all"){
  setTabs("courses");
  const list=COURSES.map((c,i)=>({c,i})).filter(({c})=>filter==="all"||(filter==="todo"?!P.done[c.id]:P.done[c.id]));
  app.innerHTML=`${topbar(doneCount()+" sur "+COURSES.length+" révisés","Les cours")}
  <label class="search">${svg(I.search,20)}<input id="sq" type="search" placeholder="Rechercher dans les fiches (autoclave, DASRI…)" autocomplete="off" enterkeyhint="search"></label>
  <div id="res" class="results" hidden></div>
  <div class="pills" role="group" aria-label="Filtrer">
    <button class="pill" data-f="all" aria-pressed="${filter==="all"}">Tous · ${COURSES.length}</button>
    <button class="pill" data-f="todo" aria-pressed="${filter==="todo"}">À réviser · ${COURSES.length-doneCount()}</button>
    <button class="pill" data-f="done" aria-pressed="${filter==="done"}">Révisés · ${doneCount()}</button>
  </div>
  ${list.length?`<ul class="list">${list.map(({c,i})=>courseRow(c,i)).join("")}</ul>`:`<p class="empty">${filter==="done"?"Aucun cours révisé pour l'instant. Ouvre un cours et va jusqu'à la dernière fiche.":"Tout est révisé. Passe à l'examen blanc."}</p>`}`;
  bindTop();
  app.querySelectorAll(".pill").forEach(b=>b.onclick=()=>courses(b.dataset.f));
  bindCourses();
  const sq=document.getElementById("sq"),res=document.getElementById("res");
  sq.addEventListener("input",()=>{
    const v=fold(sq.value.trim());
    if(v.length<2){res.hidden=true;res.innerHTML="";return}
    const hits=[];
    COURSES.forEach((c,i)=>c.cards.forEach((k,j)=>{const txt=plain(k.h+" · "+k.html+" "+(k.key||""));const f=fold(txt),p=f.indexOf(v);if(p>=0)hits.push({i,j,c,k,snip:txt.slice(Math.max(0,p-40),p+70)})}));
    res.hidden=false;
    res.innerHTML=hits.length?`<span class="label">${hits.length} résultat${hits.length>1?"s":""}</span>`+hits.slice(0,12).map(h=>`<button class="hit" data-i="${h.i}" data-j="${h.j}"><span class="label">${esc(h.c.title)}</span><b>${esc(plain(h.k.h))}</b><span class="explain">…${esc(h.snip)}…</span></button>`).join("")
      :`<p class="empty">Aucune fiche ne parle de « ${esc(sq.value)} ».</p>`;
    res.querySelectorAll(".hit").forEach(b=>b.onclick=()=>course(+b.dataset.i,"fiches",+b.dataset.j));
  });
  toTop();
}
function course(i,mode="fiches",start=0){
  setTabs("courses");
  const c=COURSES[i];
  app.innerHTML=`${topbar("Cours "+(i+1)+" / "+COURSES.length,c.title,()=>courses())}
  <div class="seg ${mode==="flash"?"right":""}" role="group" aria-label="Mode"><span class="thumb"></span>
    <button data-m="fiches" aria-pressed="${mode==="fiches"}">Fiches</button><button data-m="flash" aria-pressed="${mode==="flash"}">Flashcards</button></div>
  <div id="zone"></div>`;
  bindTop(()=>courses());
  app.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{if(b.dataset.m!==mode)course(i,b.dataset.m)});
  if(mode==="fiches")fiches(i,start);
  else runFlash(document.getElementById("zone"),QUESTIONS.filter(q=>q.c===c.id),{restart:()=>course(i,"flash"),quiz:()=>quiz(QUESTIONS.filter(q=>q.c===c.id),{label:c.title,back:()=>course(i,"flash")})});
  toTop();
}
function fiches(i,start=0){
  const c=COURSES[i],total=c.cards.length+1,zone=document.getElementById("zone");
  zone.style.display="flex";zone.style.flexDirection="column";zone.style.gap="16px";
  zone.innerHTML=`
  <div class="deck" id="deck" tabindex="0" aria-label="Fiches, glisser pour changer">
    ${c.cards.map((k,j)=>`<article class="card"><span class="corner">${star(160)}</span><span class="label">Fiche ${j+1} / ${c.cards.length}</span><h3>${k.h}</h3>${k.html}${k.key?`<div class="key"><b>${star(12)}À retenir</b>${k.key}</div>`:''}</article>`).join("")}
    <article class="card end">${star(64)}<span class="label">Fin du cours</span><h3>${esc(c.title)} : révisé</h3>
      <p class="explain">Passe aux flashcards ou teste-toi sur ce cours.</p>
      <div class="row" style="width:100%"><button class="btn" id="mini">Quiz du cours</button><button class="btn dark" id="tofc">Flashcards</button></div>
      ${i<COURSES.length-1?`<button class="btn dark" id="next-c" style="width:100%">Cours suivant</button>`:''}</article>
  </div>
  <div class="pager"><button class="nav" id="prev" aria-label="Fiche précédente">${svg(I.left)}</button>
    <div class="dots" id="dots">${Array.from({length:total},()=>'<i></i>').join("")}</div>
    <button class="nav primary" id="next" aria-label="Fiche suivante">${svg(I.right)}</button></div>`;
  const deck=document.getElementById("deck"),dots=[...zone.querySelectorAll("#dots i")],prev=document.getElementById("prev"),next=document.getElementById("next");
  let idx=0;const step=()=>deck.clientWidth+12;const go=n=>deck.scrollTo({left:n*step(),behavior:reduce?"auto":"smooth"});
  const update=()=>{idx=Math.round(deck.scrollLeft/step());dots.forEach((d,j)=>d.classList.toggle("on",j===idx));prev.disabled=idx===0;next.disabled=idx===total-1;
    if(idx===total-1&&!P.done[c.id]){P.done[c.id]=1;save();markDay();xpFloat(20);addXP(20);checkBadges()}};
  deck.addEventListener("scroll",()=>requestAnimationFrame(update),{passive:true});
  prev.onclick=()=>go(Math.max(0,idx-1));next.onclick=()=>go(Math.min(total-1,idx+1));
  deck.addEventListener("keydown",e=>{if(e.key==="ArrowRight")next.click();if(e.key==="ArrowLeft")prev.click()});
  update();
  if(start)requestAnimationFrame(()=>{deck.scrollLeft=start*step();update()});
  document.getElementById("mini").onclick=()=>quiz(QUESTIONS.filter(q=>q.c===c.id),{label:c.title,back:()=>course(i)});
  document.getElementById("tofc").onclick=()=>course(i,"flash");
  const nc=document.getElementById("next-c");if(nc)nc.onclick=()=>course(i+1);
}

function runFlash(zone,list,ctx){
  const deckQ=(ctx.daily?list:shuffle(list)).map(q=>({q:q.q,a:q.t==="qcm"?q.o[q.a]:q.a,e:q.t==="qcm"?q.e:"",src:q}));
  let pos=0,known=0,again=[];
  zone.style.display="flex";zone.style.flexDirection="column";zone.style.gap="18px";
  if(!deckQ.length){zone.innerHTML=`<section class="panel"><h3 style="font-size:18px">Rien à revoir aujourd'hui</h3><p class="explain" style="margin-top:6px">Tes cartes reviendront quand il faudra les consolider.</p></section>`;return}
  function render(){
    if(pos>=deckQ.length)return end();
    const top=deckQ.slice(pos,pos+3);
    const box=P.box[deckQ[pos].q]?P.box[deckQ[pos].q].b:0;
    zone.innerHTML=`
    <div class="sechead"><span class="label">Carte ${pos+1} / ${deckQ.length}</span><span class="label">${box?"Boîte "+box+" / 5":"Nouvelle carte"}</span></div>
    <div class="track"><i style="width:${pos/deckQ.length*100}%"></i></div>
    <div class="stack" id="stack">
      ${top.map((k,j)=>`<div class="fc ${j===1?'behind':j===2?'behind2':''}" ${j===0?'id="fc"':''} style="z-index:${3-j}">
        <div class="inner">
          <div class="face front"><span class="label">${esc(courseOf(k.src).title)}</span><h3>${esc(k.q)}</h3><span class="hint">${svg(I.flip,18)}Touche pour retourner</span></div>
          <div class="face back"><span class="label" style="color:var(--acc-text)">Réponse</span><p class="ans">${esc(k.a)}</p>${k.e?`<p class="explain">${esc(k.e)}</p>`:''}<span class="hint">Glisse à droite si tu savais, à gauche sinon</span></div>
        </div>
        ${j===0?`<span class="stamp ok">Je sais</span><span class="stamp ko">À revoir</span>`:''}
      </div>`).reverse().join("")}
    </div>
    <div class="fcbar">
      <button class="fcbtn ko" id="no" aria-label="À revoir">${svg(I.x,26)}</button>
      <button class="fcbtn flip" id="fl" aria-label="Retourner la carte">${svg(I.flip,22)}</button>
      <button class="fcbtn ok" id="yes" aria-label="Je savais">${svg(I.check,26)}</button>
    </div>`;
    const fc=document.getElementById("fc"),sOk=fc.querySelector(".stamp.ok"),sKo=fc.querySelector(".stamp.ko");
    let x0=0,y0=0,dx=0,dragging=false,moved=false;
    fc.addEventListener("pointerdown",e=>{dragging=true;moved=false;x0=e.clientX;y0=e.clientY;dx=0;fc.classList.add("dragging");try{fc.setPointerCapture(e.pointerId)}catch(_){}});
    fc.addEventListener("pointermove",e=>{if(!dragging)return;dx=e.clientX-x0;const dy=e.clientY-y0;if(Math.abs(dx)>6)moved=true;
      fc.style.transform=`translate(${dx}px,${dy*0.2}px) rotate(${dx/18}deg)`;sOk.style.opacity=Math.max(0,Math.min(1,dx/90));sKo.style.opacity=Math.max(0,Math.min(1,-dx/90))});
    const up=()=>{if(!dragging)return;dragging=false;fc.classList.remove("dragging");
      if(dx>90)decide(true);else if(dx<-90)decide(false);else{fc.style.transform="";sOk.style.opacity=0;sKo.style.opacity=0;if(!moved)fc.classList.toggle("flipped")}};
    fc.addEventListener("pointerup",up);fc.addEventListener("pointercancel",up);
    document.getElementById("fl").onclick=()=>fc.classList.toggle("flipped");
    document.getElementById("yes").onclick=()=>decide(true);
    document.getElementById("no").onclick=()=>decide(false);
    function decide(ok){
      const k=deckQ[pos];
      fc.style.transform=`translate(${ok?520:-520}px,40px) rotate(${ok?24:-24}deg)`;fc.style.opacity="0";
      (ok?sOk:sKo).style.opacity=1;
      P.cards++;record(k.src,ok);
      if(ok){known++;vib(20);addXP(2)}else{again.push(k);vib([30,40,30])}
      save();markDay();
      pos++;setTimeout(()=>{render();checkBadges()},reduce?0:260);
    }
  }
  function end(){
    const pct=Math.round(known/deckQ.length*100);
    if(pct===100)burst();
    zone.innerHTML=`<section class="panel glow-panel hero-card swap">
      <div class="ring">${ringSVG(pct)}<div class="val"><b>${cnt(known)}<span style="font-size:17px">/${deckQ.length}</span></b><small>sues</small></div></div>
      <div class="txt"><span class="label">${ctx.daily?"Révision du jour":"Flashcards"}</span><h3>${pct===100?"Tout est acquis":again.length+" carte"+(again.length>1?"s":"")+" à revoir"}</h3><p class="explain">+${known*2} XP gagnés</p></div></section>
      <div class="row">${again.length?`<button class="btn" id="again">Revoir les ${again.length} cartes</button>`:''}<button class="btn dark" id="restart">${ctx.daily?"Actualiser":"Recommencer tout"}</button></div>
      ${ctx.quiz?`<button class="btn dark" id="quizc">Quiz du cours</button>`:`<button class="btn dark" id="homeb">Retour à l'accueil</button>`}`;
    const a=document.getElementById("again");if(a)a.onclick=()=>{deckQ.splice(0,deckQ.length,...shuffle(again));pos=0;known=0;again=[];render()};
    document.getElementById("restart").onclick=ctx.restart;
    const qz=document.getElementById("quizc");if(qz)qz.onclick=ctx.quiz;
    const hb=document.getElementById("homeb");if(hb)hb.onclick=home;
  }
  render();
}

/* ---------- quiz ---------- */
let activeTimer=null;
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function quiz(list,opt={}){
  clearInterval(activeTimer);
  const qs=shuffle(list).map(q=>{if(q.t!=="qcm")return {...q,orig:q};const order=shuffle(q.o.map((t,k)=>({t,k})));return {...q,orig:q,o:order.map(x=>x.t),a:order.findIndex(x=>x.k===q.a)}});
  let n=0,score=0,combo=0,bestCombo=0,xpGain=0;const missed=[];
  const back=opt.back||examTab,mult=opt.timer?2:1,deadline=opt.real?Date.now()+opt.real*60000:0;
  setTabs("exam");
  function nextQ(){const qb=app.querySelector(".qbox");if(qb&&!reduce){qb.classList.add("leave");setTimeout(()=>{n++;render()},200)}else{n++;render()}}
  function gain(){const v=(10+Math.min(combo,5)*2)*mult;xpGain+=v;if(!opt.real)xpFloat(v)}
  function render(){
    clearInterval(activeTimer);
    if(n>=qs.length)return result();
    const q=qs[n];
    const right=opt.timer?`<div class="timer" id="tm"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" style="stroke:var(--surface-3)" stroke-width="4"/><circle id="tmc" cx="22" cy="22" r="18" fill="none" style="stroke:var(--gold)" stroke-width="4" stroke-linecap="round" stroke-dasharray="113.1" stroke-dashoffset="0"/></svg><span id="tms">${opt.timer}</span></div>`
      :opt.real?`<span class="tag g clock" id="gt">${mmss(deadline-Date.now())}</span>`:`<span class="tag g">${score} pt</span>`;
    app.innerHTML=`
    <div class="qtop"><button class="iconbtn" id="back" aria-label="Quitter">${svg(I.left)}</button>
      <div class="t"><span class="label">${esc(opt.label||"Quiz")}</span><h2>Question ${n+1} sur ${qs.length}</h2></div>${right}</div>
    <div class="track"><i style="width:${n/qs.length*100}%"></i></div>
    <section class="panel qbox">
      <div class="tags"><span class="tag g">${q.t==="qcm"?"QCM":"Question ouverte"}</span><span class="tag">${esc(courseOf(q).title)}</span>${combo>=2&&!opt.real?`<span class="combo bump">x${combo} combo</span>`:''}</div>
      <h3>${esc(q.q)}</h3><div id="qz"></div>
    </section>
    ${opt.real?`<p class="explain" style="text-align:center">Pas de correction avant la fin, comme le jour J.</p>`:''}`;
    document.getElementById("back").onclick=()=>{clearInterval(activeTimer);back()};
    if(opt.real){const gt=document.getElementById("gt");activeTimer=setInterval(()=>{const left=deadline-Date.now();gt.textContent=mmss(left);gt.classList.toggle("low",left<60000);if(left<=0){clearInterval(activeTimer);for(let k=n;k<qs.length;k++){qs[k].chosen=-1;missed.push(qs[k]);record(qs[k].orig,false)}n=qs.length;save();result()}},250)}
    const zone=document.getElementById("qz");
    if(q.t==="qcm"){
      zone.innerHTML=`<div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="l">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div><div id="fb"></div>`;
      const answer=k=>{
        clearInterval(activeTimer);
        const ok=k===q.a;q.chosen=k;
        if(ok){score++;combo++;bestCombo=Math.max(bestCombo,combo);gain()}else{combo=0;missed.push(q)}
        record(q.orig,ok);save();
        if(opt.real){
          zone.querySelectorAll(".opt").forEach(x=>x.disabled=true);
          const el=zone.querySelector(`.opt[data-k="${k}"]`);if(el)el.classList.add("picked");vib(15);
          setTimeout(nextQ,reduce?0:240);return;
        }
        zone.querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true;if(j===q.a)x.classList.add("right")});
        if(k>=0&&!ok)zone.querySelector(`.opt[data-k="${k}"]`).classList.add("wrong");
        vib(ok?25:[40,60,40]);
        document.getElementById("fb").innerHTML=`<div style="display:flex;flex-direction:column;gap:12px;margin-top:6px">
          <p class="verdict ${ok?'ok':'ko'}">${ok?(combo>=3?"Bonne réponse, "+combo+" d'affilée":"Bonne réponse"):(k<0?"Temps écoulé":"Raté")}</p><p class="explain">${esc(q.e)}</p>
          <button class="btn" id="nx">${n+1<qs.length?"Question suivante":"Voir mon score"}</button></div>`;
        const nx=document.getElementById("nx");nx.onclick=nextQ;nx.focus({preventScroll:true});
      };
      zone.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
      if(opt.timer){
        const t0=Date.now(),T=opt.timer*1000,c=document.getElementById("tmc"),s=document.getElementById("tms"),tm=document.getElementById("tm");
        activeTimer=setInterval(()=>{const left=Math.max(0,T-(Date.now()-t0));c.setAttribute("stroke-dashoffset",(113.1*(1-left/T)).toFixed(1));s.textContent=Math.ceil(left/1000);tm.classList.toggle("low",left<5000);if(left<=0)answer(-1)},100);
      }
    }else{
      zone.innerHTML=`<p class="explain">Réponds dans ta tête ou à voix haute, puis compare.</p><button class="btn" id="rev">Voir la réponse</button>`;
      document.getElementById("rev").onclick=()=>{
        zone.innerHTML=`<div class="answer swap"><span class="label">Réponse attendue</span><p>${esc(q.a)}</p></div><p class="explain">Avais-tu l'essentiel ?</p>
          <div class="row"><button class="btn good" id="y">Je savais</button><button class="btn bad" id="no">À revoir</button></div>`;
        document.getElementById("y").onclick=()=>{score++;combo++;bestCombo=Math.max(bestCombo,combo);gain();record(q.orig,true);save();nextQ()};
        document.getElementById("no").onclick=()=>{combo=0;missed.push(q);record(q.orig,false);save();nextQ()};
      };
    }
    toTop();
  }
  function result(){
    clearInterval(activeTimer);
    const pct=Math.round(score/qs.length*100);
    if(opt.full){const d=new Date();P.scores.push({p:pct,d:String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")});P.scores=P.scores.slice(-30)}
    if(pct===100&&qs.length>=10)P.perfect=true;
    if(opt.real&&pct>=80)P.realOk=true;
    save();markDay();addXP(xpGain);
    if(pct>=80)setTimeout(burst,450);
    const msg=pct>=80?"Tu es prêt pour la formation.":pct>=60?"Bonne base, revois les points ratés.":"Reprends les fiches des cours concernés.";
    const wr=wrongList().length,used=opt.real?mmss(opt.real*60000-(deadline-Date.now())):null;
    const rv=q=>q.t==="qcm"?(opt.real?`<span class="yours">Ta réponse : ${q.chosen>=0?esc(q.o[q.chosen]):"aucune"}</span>`:"")+`<span class="good-a">${esc(q.o[q.a])}</span> · ${esc(q.e)}`:esc(q.a);
    app.innerHTML=`
    <div class="qtop"><button class="iconbtn" id="back" aria-label="Retour">${svg(I.left)}</button><div class="t"><span class="label">${esc(opt.label||"Quiz")}</span><h2>Résultat</h2></div></div>
    <section class="panel glow-panel hero-card">
      <div class="ring">${ringSVG(pct)}<div class="val"><b>${cnt(pct)}<span style="font-size:17px">%</span></b><small>${score}/${qs.length}</small></div></div>
      <div class="txt"><span class="label">${pct>=80?"Validé":"À retravailler"}${used?" · "+used:""}</span><h3>${msg}</h3></div>
    </section>
    <div class="tiles">
      <div class="tile hl"><b>+${cnt(xpGain)}</b><span>XP gagnés</span></div>
      <div class="tile"><b>x${cnt(bestCombo)}</b><span>Meilleur combo</span></div>
      <div class="tile"><b>${cnt(wr)}</b><span>Erreurs en banque</span></div>
    </div>
    <div class="row"><button class="btn" id="again">Recommencer</button>${missed.length?`<button class="btn dark" id="retry">Refaire les ${missed.length} ratées</button>`:''}</div>
    ${missed.length?`<div class="sechead"><h3>${opt.real?"Correction":"À revoir"}</h3></div><ul class="review">${missed.map(q=>`<li><b>${esc(q.q)}</b>${rv(q)}</li>`).join("")}</ul>`:''}`;
    document.getElementById("back").onclick=back;
    document.getElementById("again").onclick=()=>quiz(list,opt);
    const r=document.getElementById("retry");if(r)r.onclick=()=>quiz(missed.map(m=>m.orig),{label:"Questions ratées",back});
    setTimeout(checkBadges,900);
    toTop();
  }
  render();
}

    <div class="tile"><b>${cnt(P.cards)}</b><span>Flashcards</span></div>
  </div>
  <section class="panel"><div class="sechead"><h3>7 derniers examens</h3><span class="label">Couleur = 80 % et plus</span></div>${barsHTML()}</section>
  <section class="panel" style="display:flex;flex-direction:column;gap:12px"><div class="sechead"><h3>Maîtrise par cours</h3><span class="label">Bonnes réponses</span></div>
    <ul class="mast">${COURSES.map(c=>{const m=mastery(c);return `<li><span>${esc(c.title)}</span><b>${m!=null?m+" %":"—"}</b><span class="mbar"><i class="${m==null?'':m>=80?'him':m<60?'lowm':''}" style="width:${m||0}%"></i></span></li>`}).join("")}</ul></section>
  <div class="sechead"><h3>Badges</h3><span class="label">${got} / ${BADGES.length}</span></div>
  <div class="badges">${BADGES.map(x=>`<div class="badge ${P.badges[x.id]?'on':''}"><span class="medal">${svg(x.ic,22)}</span><b>${esc(x.t)}</b><span>${esc(x.d)}</span></div>`).join("")}</div>
  <section class="panel confirm">
    ${confirmReset?`<h3 style="font-size:17px">Tout remettre à zéro ?</h3><p class="explain">Cours révisés, scores, XP, badges, cartes et erreurs seront effacés de ce téléphone. Les couleurs et la date sont gardées.</p>
      <div class="row"><button class="btn bad" id="doreset">Effacer</button><button class="btn dark" id="cancel">Annuler</button></div>`
    :`<div class="rowcard"><div class="txt"><h3 style="font-size:16px">Recommencer à zéro</h3><p>Efface ta progression sur ce téléphone</p></div><button class="btn dark" id="reset" style="padding:10px 16px">Réinitialiser</button></div>`}
  </section>`;
  bindTop();
  app.querySelectorAll(".sw").forEach(b=>b.onclick=()=>{P.pal=b.dataset.p;save();applyPal();app.querySelectorAll(".sw").forEach(x=>x.setAttribute("aria-pressed",x===b));app.querySelector(".swatches").previousElementSibling.querySelector(".label").textContent=(PALS.find(p=>p[0]===P.pal)||PALS[0])[1];vib(10)});
  const exd=document.getElementById("exd");exd.onchange=()=>{P.exam=exd.value||null;save();profile()};
  const cd=document.getElementById("cleard");if(cd)cd.onclick=()=>{P.exam=null;save();profile()};
  if(focusDate)setTimeout(()=>{exd.scrollIntoView({block:"center",behavior:reduce?"auto":"smooth"});exd.focus({preventScroll:true})},450);
  const r=document.getElementById("reset");if(r)r.onclick=()=>profile(true);
  const c=document.getElementById("cancel");if(c)c.onclick=()=>profile(false);
  const d=document.getElementById("doreset");if(d)d.onclick=()=>{const keep={pal:P.pal,exam:P.exam};P=keep;norm();save();toast(svg(I.redo),"Progression effacée","Tu repars de zéro");home()};
  toTop();
}

/* ---------- écran, zoom ---------- */
function fitScreen(){const h=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;document.documentElement.style.setProperty("--app-h",h+"px")}
fitScreen();
window.addEventListener("resize",fitScreen);
window.addEventListener("orientationchange",()=>setTimeout(fitScreen,150));
if(window.visualViewport)window.visualViewport.addEventListener("resize",fitScreen);
let lastTouch=0;
document.addEventListener("touchend",e=>{if(e.target.closest&&e.target.closest(".fc"))return;const now=Date.now();if(now-lastTouch<350){e.preventDefault();const b=e.target.closest&&e.target.closest("button");if(b&&!b.disabled)b.click()}lastTouch=now},{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault());

home();
checkBadges();

</script>
</body>
</html>
